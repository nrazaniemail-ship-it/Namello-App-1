name: Namello Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namello-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify project files
        shell: bash
        run: |
          set -e
          test -f package.json || {
            echo "ERROR: package.json not found in repository root."
            exit 1
          }
          test -f index.html || {
            echo "ERROR: index.html not found in repository root."
            exit 1
          }
          test -f capacitor.config.ts || {
            echo "ERROR: capacitor.config.ts not found in repository root."
            exit 1
          }

      - name: Inspect package scripts
        shell: bash
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            console.log('Package:', p.name);
            console.log('Scripts:', JSON.stringify(p.scripts ?? {}, null, 2));
            console.log('Dependencies:', JSON.stringify(p.dependencies ?? {}, null, 2));
          "

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Verify build script
        shell: bash
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!p.scripts?.build) {
              console.error('ERROR: package.json does not define a build script.');
              process.exit(1);
            }
          "

      - name: Build web application
        run: npm run build

      - name: Verify web output
        shell: bash
        run: |
          set -e
          test -f dist/index.html || {
            echo "ERROR: dist/index.html was not generated."
            exit 1
          }

      - name: Verify Capacitor dependency
        shell: bash
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!p.dependencies?.['@capacitor/core'] &&
                !p.devDependencies?.['@capacitor/core']) {
              console.error('ERROR: @capacitor/core is missing.');
              process.exit(1);
            }
            if (!p.dependencies?.['@capacitor/cli'] &&
                !p.devDependencies?.['@capacitor/cli']) {
              console.error('ERROR: @capacitor/cli is missing.');
              process.exit(1);
            }
            if (!p.dependencies?.['@capacitor/android'] &&
                !p.devDependencies?.['@capacitor/android']) {
              console.error('ERROR: @capacitor/android is missing.');
              process.exit(1);
            }
          "

      - name: Generate Android project if needed
        shell: bash
        run: |
          set -e
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          test -f android/gradlew
          test -f android/build.gradle -o -f android/build.gradle.kts -o \
               -f android/settings.gradle -o -f android/settings.gradle.kts

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Namello-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
