name: Namello Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify required files
        run: |
          set -eu
          test -f package.json || {
            echo "ERROR: package.json not found in repository root."
            exit 1
          }
          test -f index.html || {
            echo "ERROR: index.html not found in repository root."
            exit 1
          }
          test -f capacitor.config.ts || {
            echo "ERROR: capacitor.config.ts not found."
            exit 1
          }
          echo "Required files found."

      - name: Inspect package configuration
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            console.log('Package:', p.name);
            console.log('Scripts:', JSON.stringify(p.scripts || {}, null, 2));
            console.log('Dependencies:', JSON.stringify({
              ...p.dependencies,
              ...p.devDependencies
            }, null, 2));
          "

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Verify build script
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!p.scripts || !p.scripts.build) {
              console.error('ERROR: package.json does not define a build script.');
              process.exit(1);
            }
            console.log('Build command:', p.scripts.build);
          "

      - name: Check backend syntax if present
        run: |
          if [ -f server.mjs ]; then
            node --check server.mjs
          else
            echo "No root server.mjs found; skipping backend syntax check."
          fi

      - name: Build web application
        run: npm run build

      - name: Verify web output
        run: |
          set -eu
          test -s dist/index.html || {
            echo "ERROR: dist/index.html was not generated."
            exit 1
          }
          echo "Web output verified."

      - name: Verify Capacitor dependencies
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const deps = {
              ...p.dependencies,
              ...p.devDependencies
            };
            for (const name of ['@capacitor/cli', '@capacitor/core', '@capacitor/android']) {
              if (!deps[name]) {
                console.error('ERROR: Missing dependency:', name);
                process.exitCode = 1;
              } else {
                console.log(name + ': ' + deps[name]);
              }
            }
          "

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android project
        run: |
          set -eu
          test -f android/gradlew
          test -f android/app/build.gradle
          echo "Android project verified."

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -eu
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || {
            echo "ERROR: APK file was not generated."
            exit 1
          }
          echo "APK generated successfully."
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Namello-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
