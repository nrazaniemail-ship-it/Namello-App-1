name: Namello Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: namello-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify project files
        run: |
          set -eu
          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f capacitor.config.ts
          test -f assets/icon-only.png
          node --version
          npm --version

      - name: Inspect package scripts
        run: npm run

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check backend syntax
        run: npm run check

      - name: Install frontend build dependencies
        run: npm install --no-save vite typescript @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund

      - name: Build web application
        run: npx vite build

      - name: Verify web build
        run: test -s dist/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -eu
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Namello-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
