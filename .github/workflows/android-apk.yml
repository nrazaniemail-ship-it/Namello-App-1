name: Namello Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify required project files
        run: |
          set -eu
          test -f package.json
          test -f index.html
          test -f capacitor.config.ts
          echo "Project files found."

      - name: Inspect package scripts
        run: |
          node -e "const p=require('./package.json'); console.log(JSON.stringify({name:p.name,scripts:p.scripts},null,2))"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check backend syntax if present
        run: |
          if [ -f server.mjs ]; then
            node --check server.mjs
          else
            echo "No server.mjs at repository root; skipping backend syntax check."
          fi

      - name: Build web application
        run: npm run build

      - name: Verify web build
        run: |
          set -eu
          test -f dist/index.html
          echo "Web build verified."

      - name: Verify Capacitor dependency
        run: |
          node -e "console.log('Capacitor CLI:', require.resolve('@capacitor/cli/package.json'))"
          node -e "console.log('Android platform:', require.resolve('@capacitor/android/package.json'))"

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android project
        run: |
          set -eu
          test -f android/gradlew
          test -f android/app/build.gradle
          echo "Android project verified."

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -eu
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Namello-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
