name: Namello Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: namello-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # 1. دریافت سورس پروژه
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. نصب Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. نصب Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 4. آماده‌سازی Android SDK بدون نصب خودکار پکیج‌ها
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # 5. بررسی ابزار مدیریت SDK
      - name: Verify Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"

          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || \
          test -x "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager" || \
          command -v sdkmanager

          sdkmanager --version

      # 6. نصب بسته‌های ضروری Android
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="${ANDROID_HOME}" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. پذیرش مجوزهای Android SDK
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses || true

      # 8. بررسی فایل‌های ضروری
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f capacitor.config.ts

          echo "Project files verified."

      # 9. نمایش اسکریپت‌های موجود
      - name: Inspect package scripts
        run: npm run

      # 10. نصب وابستگی‌های بک‌اند
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      # 11. بررسی نحو بک‌اند
      - name: Check backend syntax
        run: npm run check

      # 12. نصب ابزارهای رابط کاربری و Capacitor
      - name: Install frontend and Capacitor dependencies
        run: |
          npm install --no-save --no-audit --no-fund \
            vite \
            typescript \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # 13. ساخت رابط کاربری
      - name: Build web application
        run: npx vite build

      # 14. بررسی خروجی وب
      - name: Verify web build
        run: test -s dist/index.html

      # 15. بررسی وجود پروژه Android
      - name: Check Android project
        id: android_project
        shell: bash
        run: |
          if [ -f android/gradlew ] && [ -f android/app/build.gradle ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 16. ایجاد پروژه Android در صورت نیاز
      - name: Generate Android project
        if: steps.android_project.outputs.exists == 'false'
        run: npx cap add android

      # 17. همگام‌سازی Capacitor
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 18. بررسی فایل‌های پروژه Android
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/app/build.gradle

          chmod +x android/gradlew

      # 19. ساخت APK
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # 20. بررسی APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK created successfully."
          ls -lh "$APK"
          sha256sum "$APK"

      # 21. انتشار فایل APK به‌عنوان Artifact
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Namello-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
